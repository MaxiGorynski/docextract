# ==============================================================================
# FILE: nginx.conf
# LOCATION: /docextract/nginx/nginx.conf
# ==============================================================================
#
# PURPOSE:
#   Main Nginx configuration for DocExtract production deployment.
#   Handles core server settings, worker processes, and logging.
#   Server blocks are defined separately in conf.d/default.conf.
#
# ARCHITECTURE:
#   nginx.conf (this file)
#       └── conf.d/default.conf (server blocks, SSL, proxy settings)
#
# PERFORMANCE TUNING:
#   - worker_processes: Set to 'auto' to match CPU cores
#   - worker_connections: 1024 is sufficient for moderate traffic
#   - keepalive_timeout: 65s balances connection reuse vs resource usage
#   - gzip: Enabled for text content to reduce bandwidth
#
# SECURITY:
#   - server_tokens off: Hides Nginx version in responses
#   - Actual security headers are in conf.d/default.conf per-server
#
# LOGGING:
#   - Access logs: Combined format with response time
#   - Error logs: Warning level (adjust to 'info' for debugging)
#   - Health check endpoint logging disabled in server block
#
# USAGE:
#   This file is mounted read-only into the Nginx container:
#   volumes:
#     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#
# TESTING:
#   Validate configuration:
#       docker compose -f docker-compose.prod.yml exec nginx nginx -t
#
#   Reload after changes:
#       docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
#
# ==============================================================================

# Run as nginx user (default in nginx:alpine)
user nginx;

# Auto-detect number of CPU cores
worker_processes auto;

# Error log location and level
error_log /var/log/nginx/error.log warn;

# PID file location
pid /var/run/nginx.pid;

# =============================================================================
# Events Configuration
# =============================================================================
events {
    # Maximum simultaneous connections per worker
    worker_connections 1024;

    # Accept multiple connections at once
    multi_accept on;

    # Use efficient event method (epoll on Linux)
    use epoll;
}

# =============================================================================
# HTTP Configuration
# =============================================================================
http {
    # -------------------------------------------------------------------------
    # Basic Settings
    # -------------------------------------------------------------------------

    # Include MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide Nginx version for security
    server_tokens off;

    # Efficient file serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Connection timeouts
    keepalive_timeout 65;
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;

    # Buffer sizes
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    client_max_body_size 50M;
    large_client_header_buffers 4 8k;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------

    # Custom log format with response time
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Access log location
    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Rate Limiting (optional - uncomment to enable)
    # -------------------------------------------------------------------------

    # Define rate limit zone (10 requests per second per IP)
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # -------------------------------------------------------------------------
    # Upstream (Django/Gunicorn)
    # -------------------------------------------------------------------------

    upstream django {
        server web:8000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Include Server Blocks
    # -------------------------------------------------------------------------

    include /etc/nginx/conf.d/*.conf;
}