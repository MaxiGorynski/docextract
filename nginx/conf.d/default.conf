# ==============================================================================
# FILE: default.conf
# LOCATION: /docextract/nginx/conf.d/default.conf
# ==============================================================================
#
# PURPOSE:
#   Nginx server blocks for DocExtract production deployment.
#   Handles HTTP to HTTPS redirect, SSL termination, static file serving,
#   and reverse proxy to Django/Gunicorn.
#
# SSL SETUP INSTRUCTIONS:
#   This configuration supports two modes:
#
#   1. INITIAL SETUP (HTTP only, for obtaining SSL certificates):
#      - Use this file as-is with only the HTTP server block
#      - Start nginx: docker compose -f docker-compose.prod.yml up -d nginx
#      - Obtain certificate: certbot certonly --webroot -w ./certbot/www -d your-domain.com
#      - Replace with full SSL config
#      - Restart nginx: docker compose -f docker-compose.prod.yml restart nginx
#
#   2. PRODUCTION (HTTPS enabled):
#      - Ensure SSL certificates exist in ./certbot/conf/live/your-domain.com/
#      - Both server blocks should be active
#      - HTTP serves only ACME challenges and redirects everything else to HTTPS
#
# CURRENT MODE: HTTP-only (pre-SSL setup)
#
# ==============================================================================

# =============================================================================
# HTTP Server (Port 80)
# =============================================================================
# Serves the application over HTTP. Once SSL is configured, this will
# redirect to HTTPS and only serve ACME challenges.

server {
    listen 80;
    listen [::]:80;
    server_name 157.90.23.50;

    # Certbot ACME challenge location
    # Required for initial certificate issuance and renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # -------------------------------------------------------------------------
    # Static Files
    # -------------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Media Files (User Uploads)
    # -------------------------------------------------------------------------
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Health Check Endpoint
    # -------------------------------------------------------------------------
    location /health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Django Application
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://django;

        # Pass real client information to Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for streaming responses
        proxy_buffering off;
        proxy_redirect off;

        # Timeouts (extraction can take time)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Maximum upload size
        client_max_body_size 50M;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -------------------------------------------------------------------------
    # Favicon and Robots
    # -------------------------------------------------------------------------
    location = /favicon.ico {
        alias /app/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        alias /app/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }
}