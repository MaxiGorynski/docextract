# ==============================================================================
# FILE: default.conf
# LOCATION: /docextract/nginx/conf.d/default.conf
# ==============================================================================
#
# PURPOSE:
#   Nginx server blocks for DocExtract production deployment.
#   Handles HTTP to HTTPS redirect, SSL termination, static file serving,
#   and reverse proxy to Django/Gunicorn.
#
# SSL SETUP INSTRUCTIONS:
#   This configuration supports two modes:
#
#   1. INITIAL SETUP (HTTP only, for obtaining SSL certificates):
#      - Comment out the entire HTTPS server block (lines marked HTTPS_START to HTTPS_END)
#      - Start nginx: docker compose -f docker-compose.prod.yml up -d nginx
#      - Obtain certificate: certbot certonly --webroot -w ./certbot/www -d your-domain.com
#      - Uncomment the HTTPS server block
#      - Restart nginx: docker compose -f docker-compose.prod.yml restart nginx
#
#   2. PRODUCTION (HTTPS enabled):
#      - Ensure SSL certificates exist in ./certbot/conf/live/your-domain.com/
#      - Both server blocks should be active
#      - HTTP serves only ACME challenges and redirects everything else to HTTPS
#
# DOMAIN CONFIGURATION:
#   Replace 'docextract.example.com' with your actual domain throughout this file.
#   Use sed for bulk replacement:
#       sed -i 's/docextract.example.com/your-actual-domain.com/g' nginx/conf.d/default.conf
#
# STATIC FILES:
#   - /static/ → /app/staticfiles/ (Django collectstatic output)
#   - /media/  → /app/media/ (User uploads)
#   Both are served directly by Nginx with caching headers.
#
# SECURITY HEADERS:
#   - X-Frame-Options: SAMEORIGIN (clickjacking protection)
#   - X-Content-Type-Options: nosniff (MIME sniffing protection)
#   - X-XSS-Protection: 1; mode=block (XSS filter)
#   - Referrer-Policy: strict-origin-when-cross-origin
#   - Content-Security-Policy: Commented out (enable and customise as needed)
#
# PROXY SETTINGS:
#   - Forwards real client IP to Django
#   - Sets proper scheme (https) for Django's request.is_secure()
#   - Timeout of 120s for long-running extraction requests
#
# TESTING:
#   Test configuration: docker compose -f docker-compose.prod.yml exec nginx nginx -t
#   Check headers: curl -I https://your-domain.com
#
# ==============================================================================

# =============================================================================
# HTTP Server (Port 80)
# =============================================================================
# Serves ACME challenges for SSL certificate renewal and redirects all other
# traffic to HTTPS. In initial setup mode, this also serves the application.

server {
    listen 80;
    listen [::]:80;
    server_name docextract.example.com;

    # Certbot ACME challenge location
    # Required for initial certificate issuance and renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    # Comment out this block during initial setup if SSL certs don't exist yet
    location / {
        return 301 https://$host$request_uri;
    }

    # INITIAL SETUP ONLY: Uncomment these blocks to serve app over HTTP
    # while obtaining SSL certificates. Remove/comment once HTTPS is working.
    #
    # location /static/ {
    #     alias /app/staticfiles/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
    #
    # location /media/ {
    #     alias /app/media/;
    #     expires 7d;
    #     add_header Cache-Control "public";
    # }
    #
    # location / {
    #     proxy_pass http://django;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

# =============================================================================
# HTTPS Server (Port 443)
# =============================================================================
# Main application server with SSL/TLS encryption.
#
# HTTPS_START - Comment from here to HTTPS_END during initial SSL setup
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docextract.example.com;

    # -------------------------------------------------------------------------
    # SSL Certificate Configuration
    # -------------------------------------------------------------------------
    # Certificates are obtained via Certbot and mounted from ./certbot/conf/
    ssl_certificate /etc/letsencrypt/live/docextract.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docextract.example.com/privkey.pem;

    # SSL session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration (TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS (uncomment after confirming HTTPS works correctly)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy (uncomment and customise as needed)
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Client Settings
    # -------------------------------------------------------------------------
    # Maximum upload size (must match Django's FILE_UPLOAD_MAX_MEMORY_SIZE)
    client_max_body_size 50M;

    # -------------------------------------------------------------------------
    # Static Files
    # -------------------------------------------------------------------------
    # Served directly by Nginx for performance
    # Django's collectstatic outputs here
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Enable gzip for static files
        gzip_static on;

        # Fallback if file not found
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Media Files (User Uploads)
    # -------------------------------------------------------------------------
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";

        # Security: Prevent execution of uploaded files
        add_header X-Content-Type-Options "nosniff" always;

        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Health Check Endpoint
    # -------------------------------------------------------------------------
    # No logging for health checks to reduce noise
    location /health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    # -------------------------------------------------------------------------
    # Django Application
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://django;

        # Pass real client information to Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for streaming responses
        proxy_buffering off;
        proxy_redirect off;

        # Timeouts (extraction can take time)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -------------------------------------------------------------------------
    # Favicon and Robots
    # -------------------------------------------------------------------------
    location = /favicon.ico {
        alias /app/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        alias /app/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }
}
# HTTPS_END